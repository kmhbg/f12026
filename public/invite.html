<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e10600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Välj lösenord</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="invite">
    <header class="site-header">
      <div class="header-top">
        <div class="header-top-inner">
          <span class="header-tag">Säsong 2026 · Formel 1 betting</span>
          <div class="header-top-actions">
            <a href="/app-installation.html" class="header-cta-pill">Ladda ner app</a>
          </div>
        </div>
      </div>
      <div class="header-main">
        <div class="header-main-inner">
          <a href="/index.html" class="site-logo" aria-label="F1tting startsida">
            <span class="logo-mark"><span class="logo-f1">F1</span><span class="logo-rest">tting</span></span>
          </a>
          <nav class="header-nav" aria-label="Huvudnavigation">
            <a href="/index.html" class="nav-link">Spel</a>
            <a href="/settlement.html" class="nav-link">Rättning</a>
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/live.html" class="nav-link">Pit Wall</a>
            <a href="/app-installation.html" class="nav-link">App</a>
          </nav>
        </div>
      </div>
      <div class="header-speed-lines" aria-hidden="true">
        <span class="speed-line-logo"></span>
        <span class="speed-line-track"></span>
      </div>
    </header>

    <main>
      <h1 class="page-title">Välj lösenord</h1>
      <section class="section-block auth-box">
        <p id="invite-intro" class="info">Kontrollerar länken…</p>
        <form id="invite-form" class="auth-form">
          <label for="password">Lösenord (minst 8 tecken)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          <label for="password2">Upprepa lösenord</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required />
          <button type="submit">Spara och logga in</button>
          <p id="form-status" class="status"></p>
        </form>
      </section>
    </main>

    <script src="auth.js"></script>
    <script src="branding.js"></script>
    <script src="auth-pages.js"></script>
  </body>
</html>
