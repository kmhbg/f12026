# Separat WAHA-worker för F1-gruppen. Körs bredvid den befintliga WAHA-instansen
# på waha-korv (VM 102, 172.16.16.66) men med egen port, egen session och egen
# lagring, så att korv-botten och F1-flödet inte påverkar varandra.
services:
  waha-f1:
    image: devlikeapro/waha:latest
    container_name: waha-f1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WAHA_WORKER_ID: waha-f1
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_WORKER_RESTART_SESSIONS: "True"
    volumes:
      - ./sessions:/app/.sessions
