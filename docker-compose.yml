# Snabbstart: cp .env.example .env && docker compose up -d
# Öppna sedan http://<din-server>:3000 och skapa admin-kontot.
services:
  f1-betting:
    build: .
    env_file: .env
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
